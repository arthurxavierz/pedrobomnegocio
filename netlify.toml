# Pedro Bom Negócio — site estático (sem build step)
[build]
  publish = "dist"
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Assets versionados: cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML sempre revalidado (evita servir versão antiga após deploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS e JS ficam na raiz (fora de /assets) e por isso não são versionados
# por caminho: precisam revalidar a cada visita, senão o navegador serve
# o HTML novo com a folha de estilo antiga.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# URLs limpas: /propostas -> /propostas.html
[[redirects]]
  from = "/propostas"
  to = "/propostas.html"
  status = 200
[[redirects]]
  from = "/sobre"
  to = "/sobre.html"
  status = 200
[[redirects]]
  from = "/participe"
  to = "/participe.html"
  status = 200

# 404 personalizado
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
